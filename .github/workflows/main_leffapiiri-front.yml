# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Leffapiiri-Front

on:
  push:
    branches:
      - 'main'
    paths:
      - 'client/**' # Käynnistyy vain kun frontend-koodia muutetaan
      - '.github/workflows/main_leffapiiri-front.yml' # ...tai tätä workflowta itseään
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    defaults:
      run:
        working-directory: client # Frontendin koodi on client-kansiossa

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: npm install, build, and test
        env:
          # Backendin osoite, joka leivotaan buildiin. Asetetaan GitHubissa:
          # Settings -> Secrets and variables -> Actions -> Variables
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: client/dist # Vain valmis build, ei lähdekoodia

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1A51EDD7D45445EDA0A329DF15427D5A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9A01716397DD4607ABCFE1D7FB9DADD9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_28F5778349954E6C8347BCC538487FFC }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Leffapiiri-Front'
          slot-name: 'Production'
          package: .
